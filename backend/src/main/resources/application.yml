spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_registration}
    username: ${DB_USERNAME:event_user}
    password: ${DB_PASSWORD:event_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

server:
  port: 8080

app:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin123}
