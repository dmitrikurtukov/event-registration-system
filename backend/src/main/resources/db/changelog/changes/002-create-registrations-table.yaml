databaseChangeLog:
  - changeSet:
      id: 002-create-registrations-table
      author: dmitrikurtukov
      changes:
        - createTable:
            tableName: registrations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: personal_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: registrations
            baseColumnNames: event_id
            constraintName: fk_registrations_event_id
            referencedTableName: events
            referencedColumnNames: id
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: registrations
            columnNames: event_id, personal_code
            constraintName: uq_registrations_event_personal_code
