databaseChangeLog:
  - changeSet:
      id: 001-create-events-table
      author: dmitrikurtukov
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: event_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: max_participants
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: ALTER TABLE events ADD CONSTRAINT chk_events_max_participants_positive CHECK (max_participants > 0);
